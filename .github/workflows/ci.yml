name: Production Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-build:
    name: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/csg_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: csg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d csg_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint when configured
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck:test

      - name: Prepare test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-test-db.sql
          npm run db:migrate

      - name: Tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build
