  <!-- precision rings -->
  <circle cx="256" cy="256" r="193" stroke="url(#ring)" stroke-width="2.4"/>
  <circle cx="256" cy="256" r="169" stroke="#FF8DA6" stroke-opacity="0.72" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="149" stroke="#FFF5D0" stroke-opacity="0.20" stroke-width="1.1" stroke-dasharray="3 8"/>

  <!-- cardinal markers -->
  <g fill="#FF8DA6" filter="url(#glow)">
    <circle cx="256" cy="63" r="4.6"/>
    <circle cx="449" cy="256" r="4.6"/>
    <circle cx="256" cy="449" r="4.6"/>
    <circle cx="63" cy="256" r="4.6"/>
  </g>

