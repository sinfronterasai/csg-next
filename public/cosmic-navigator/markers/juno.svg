<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8DA6" stop-opacity="0.22"/>
      <stop offset="62%" stop-color="#FF8DA6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF8DA6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="96" y1="88" x2="416" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D8"/>
      <stop offset="0.35" stop-color="#FF8DA6"/>
      <stop offset="0.75" stop-color="#FF8DA6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF7D8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
  </defs>

  <!-- Transparent canvas; subtle dark core only -->
  <circle cx="256" cy="256" r="190" fill="#070A13" fill-opacity="0.56"/>
  <circle cx="256" cy="256" r="190" fill="url(#core)"/>

  <!-- soft aura -->
