<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B83B" stop-opacity="0.22"/>
      <stop offset="62%" stop-color="#F5B83B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F5B83B" stop-opacity="0"/>
